<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务部实习生成长导航智能看板</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (typeof Chart === 'undefined') {
        document.body.insertAdjacentHTML('afterbegin', '<div style="background:#FFF3E0;color:#E65100;padding:12px 20px;text-align:center;font-size:14px;">⚠️ 图表库加载失败，部分数据可视化功能不可用。请检查网络连接后刷新页面。</div>');
      }
    });
  </script>
</head>
<body>
  <!-- 角色选择页 -->
  <div id="role-select">
    <div class="role-select-header">
      <h1>实习生成长导航智能看板</h1>
      <p>请选择你的角色，开启成长之旅</p>
    </div>
    <div class="role-cards">
      <div class="role-card" onclick="App.selectRole('intern', 1)">
        <div class="role-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h3>实习生</h3>
        <p>查看成长路线、完成任务、撰写日志、获取AI反馈</p>
      </div>
      <div class="role-card" onclick="App.selectRole('mentor', 1)">
        <div class="role-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <h3>导师</h3>
        <p>管理实习生、分配任务、查看日志、评价反馈</p>
      </div>
      <div class="role-card" onclick="App.selectRole('hr', 1)">
        <div class="role-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        </div>
        <h3>HR / 招聘</h3>
        <p>数据大盘、风险预警、日志统计、适岗评估</p>
      </div>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app-container">
    <aside id="sidebar"></aside>
    <div id="main-area">
      <header id="header"></header>
      <main id="main-content"></main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ai-assistant.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
